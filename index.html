<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CESP — Collector's Edition Softwares &amp; Products</title>
<meta name="description" content="Coleciono algumas peças, revendo outras, e no tempo livre desenvolvo software. Tokens impressos, ferramentas grátis e acervo.">
<meta property="og:title" content="CESP — Collector's Edition Softwares &amp; Products">
<meta property="og:description" content="Tokens impressos, ferramentas grátis e acervo.">
<meta property="og:image" content="assets/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0A0C0A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --preto:#0A0C0A; --carvao:#121512; --linha:#1E241F; --papel:#EFEFEA;
  --fosforo:#7CE78C; --fosforo-d:#4E9E62; --osso:#E7E4DC; --bruma:#8A9A8E;
  --W:#FFFBD5; --U:#58B6FF; --B:#6E7A8C; --R:#FF5B5B; --G:#00E552; --I:#CE9440;
  --max:1080px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--preto);color:var(--osso);
  font-family:"Inter",system-ui,sans-serif;font-size:15.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:0 18px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* ---------------- topo ---------------- */
header{position:sticky;top:0;z-index:40;background:rgba(10,12,10,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo{display:flex;align-items:center;gap:14px;height:58px}
.marca{display:flex;align-items:center;gap:9px;flex-shrink:0}
.marca svg{width:74px;height:auto;color:var(--fosforo);display:block}
.caminho{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--fosforo-d);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.caminho b{color:var(--fosforo);font-weight:400}
.cart-btn{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--fosforo);
  border:1px solid var(--fosforo-d);padding:6px 11px;cursor:pointer;background:none;
  display:flex;align-items:center;gap:7px;flex-shrink:0}
.cart-btn span#qtd{background:var(--fosforo);color:var(--preto);border-radius:99px;
  padding:0 6px;font-size:11px;font-weight:700}
.idioma{display:flex;border:1px solid var(--linha);flex-shrink:0}
.idioma .lg{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:6px 9px;
  color:var(--bruma);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.idioma .lg.on{background:var(--fosforo);color:var(--preto);font-weight:700}
.idioma .lg:not(.on):hover{color:var(--osso)}
@media(max-width:520px){.caminho{display:none}}

/* nav de diretórios */
.dirs{border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.dirs::-webkit-scrollbar{display:none}
.dirs-in{display:flex;gap:2px;min-width:max-content}
.dir{font-family:"JetBrains Mono",monospace;font-size:12.5px;padding:11px 13px;
  color:var(--bruma);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.dir:hover{color:var(--osso)}
.dir.on{color:var(--osso);border-bottom-color:var(--cor)}
.dir i{display:inline-block;width:7px;height:7px;margin-right:7px;background:var(--cor);
  vertical-align:1px}

/* ---------------- hero ---------------- */
.hero{padding:46px 0 34px;border-bottom:1px solid var(--linha)}
.hero .cli{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--fosforo-d);
  margin-bottom:20px}
.hero .cli b{color:var(--fosforo);font-weight:400}
.hero h1{font-family:"JetBrains Mono",monospace;font-weight:800;letter-spacing:-.04em;
  font-size:clamp(27px,7vw,46px);line-height:1.04;margin:0 0 14px;color:var(--osso)}
.hero p{max-width:56ch;color:var(--bruma);margin:0 0 22px}
.hero .acoes{display:flex;gap:9px;flex-wrap:wrap}
.btn{font-family:"JetBrains Mono",monospace;font-size:12.5px;padding:10px 15px;
  border:1px solid var(--fosforo-d);color:var(--fosforo);cursor:pointer;background:none}
.btn.cheio{background:var(--fosforo);color:var(--preto);border-color:var(--fosforo);font-weight:700}
.btn:hover{border-color:var(--fosforo)}

/* ls das pastas */
.ls{display:grid;gap:1px;background:var(--linha);border:1px solid var(--linha);margin:30px 0}
@media(min-width:560px){.ls{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.ls{grid-template-columns:repeat(3,1fr)}}
.ls a{background:var(--preto);padding:15px 16px;display:flex;gap:13px;align-items:flex-start}
.ls a:hover{background:var(--carvao)}
.ls .q{width:11px;height:11px;background:var(--cor);margin-top:5px;flex-shrink:0}
.ls .n{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--osso)}
.ls .d{font-size:12.5px;color:var(--bruma);line-height:1.45}
.ls .c{font-family:"Silkscreen",monospace;font-size:9px;color:var(--fosforo-d);margin-left:auto}

/* ---------------- grade de itens ---------------- */
.secao{padding:34px 0}
.secao-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:18px;flex-wrap:wrap}
.secao-cab h2{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:19px;
  letter-spacing:-.03em;margin:0}
.secao-cab .sub{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--bruma)}
.grade{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grade{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--carvao);border:1px solid var(--linha);position:relative;
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.item:hover{border-color:var(--fosforo-d)}
.item .mn{position:absolute;top:0;right:0;width:5px;height:100%;display:flex;
  flex-direction:column;z-index:2}
.item .mn i{flex:1;opacity:.13}
.item .mn i.on{opacity:1}
.foto{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(70% 60% at 50% 42%,rgba(124,231,140,.09),transparent 72%);
  border-bottom:1px solid var(--linha);
  font-family:"Silkscreen",monospace;font-size:9px;color:rgba(124,231,140,.34)}
.item .txt{padding:11px 14px 13px 12px;flex:1;display:flex;flex-direction:column}
.item .nm{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13.5px;
  line-height:1.25;letter-spacing:-.02em;margin-bottom:4px}
.item .fc{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--bruma);
  line-height:1.45;margin-bottom:9px}
.item .pr{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.preco{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:14px;color:var(--osso)}
.selo{font-family:"Silkscreen",monospace;font-size:8.5px;padding:3px 6px;letter-spacing:.04em}
.selo.acervo{color:var(--bruma);border:1px solid var(--linha)}
.selo.venda{background:var(--R);color:var(--preto)}
.selo.encomenda{color:var(--G);border:1px solid var(--G)}
.selo.gratis{background:var(--I);color:var(--preto)}
.selo.esgotado{color:var(--bruma);border:1px solid var(--linha);text-decoration:line-through}

/* ---------------- página de item ---------------- */
.item-pg{display:grid;gap:26px;padding:28px 0}
@media(min-width:800px){.item-pg{grid-template-columns:1.15fr 1fr;gap:34px}}
.galeria{display:grid;gap:6px;grid-template-columns:repeat(4,1fr)}
.galeria .g1{grid-column:1/-1;aspect-ratio:4/3}
.galeria .gm{aspect-ratio:1/1}
.galeria div{background:radial-gradient(70% 60% at 50% 42%,rgba(124,231,140,.09),transparent 72%);
  border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;
  font-family:"Silkscreen",monospace;font-size:8px;color:rgba(124,231,140,.32)}
.item-pg h1{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:clamp(22px,5vw,30px);
  letter-spacing:-.035em;line-height:1.08;margin:0 0 8px}
.item-pg .cat{font-family:"JetBrains Mono",monospace;font-size:12px;margin-bottom:16px}
.ficha{border-top:1px solid var(--linha);margin:18px 0}
.ficha div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid var(--linha);font-family:"JetBrains Mono",monospace;font-size:12.5px}
.ficha span:first-child{color:var(--bruma)}
.compra{background:var(--carvao);border:1px solid var(--linha);padding:16px;margin-top:18px}
.compra .valor{font-family:"JetBrains Mono",monospace;font-weight:800;
  font-size:clamp(24px,6vw,32px);letter-spacing:-.03em;margin-bottom:4px}
.compra .obs{font-size:12.5px;color:var(--bruma);margin-bottom:13px}
.compra .btn{width:100%;text-align:center;padding:13px}

/* ---------------- notas ---------------- */
.nota-lista a{display:block;padding:16px 0;border-bottom:1px solid var(--linha)}
.nota-lista a:hover .t{color:var(--fosforo)}
.nota-lista .dt{font-family:"Silkscreen",monospace;font-size:9px;color:var(--fosforo-d)}
.nota-lista .t{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:17px;
  letter-spacing:-.025em;margin:5px 0 4px}
.nota-lista .r{color:var(--bruma);font-size:13.5px}
.artigo{background:var(--papel);color:#16181D;padding:30px 22px;margin:24px 0;
  max-width:68ch}
.artigo h1{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:clamp(23px,5.4vw,31px);
  letter-spacing:-.035em;line-height:1.1;margin:0 0 6px}
.artigo .dt{font-family:"Silkscreen",monospace;font-size:9px;color:#696C73;margin-bottom:18px}
.artigo p{margin:0 0 15px}
.artigo h2{font-family:"JetBrains Mono",monospace;font-size:17px;margin:26px 0 8px}

/* ---------------- carrinho ---------------- */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.on{display:block}
.drawer .fundo{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.drawer .painel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);
  background:var(--preto);border-left:1px solid var(--linha);display:flex;flex-direction:column}
.drawer .cab{padding:16px 18px;border-bottom:1px solid var(--linha);
  display:flex;justify-content:space-between;align-items:center}
.drawer .cab b{font-family:"JetBrains Mono",monospace;font-size:13px}
.drawer .corpo{flex:1;overflow-y:auto;padding:8px 18px}
.drawer .pe{padding:16px 18px;border-top:1px solid var(--linha)}
.linha-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--linha)}
.linha-item .mini{width:52px;height:52px;background:var(--carvao);border:1px solid var(--linha);
  flex-shrink:0}
.linha-item .n{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:700;line-height:1.3}
.linha-item .p{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--bruma)}
.linha-item .x{margin-left:auto;color:var(--bruma);cursor:pointer;font-size:18px;line-height:1}
.tot{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;
  font-size:13px;margin-bottom:5px}
.tot.grande{font-size:17px;font-weight:800;margin:10px 0 14px}
.vazio{color:var(--bruma);font-size:13.5px;padding:26px 0;text-align:center;
  font-family:"JetBrains Mono",monospace}

/* ---------------- rodapé ---------------- */
footer{border-top:1px solid var(--linha);margin-top:40px;padding:28px 0 46px}
.rod{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.rod svg{width:104px;color:var(--fosforo-d)}
.rod .col{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--bruma);line-height:2}
.rod .col a:hover{color:var(--fosforo)}
.rod .leg{font-family:"Silkscreen",monospace;font-size:8.5px;color:var(--fosforo-d);margin-top:9px}
.oculto{display:none}

/* ---- acréscimos da versão publicada ---- */
.foto img,.galeria img{width:100%;height:100%;object-fit:cover;display:block}
.galeria div{overflow:hidden;padding:0}
.carregando{padding:70px 0;text-align:center;font-family:"JetBrains Mono",monospace;
  font-size:13px;color:var(--fosforo-d)}
.carregando::after{content:"_";animation:pisca 1s step-end infinite}
@keyframes pisca{50%{opacity:0}}
.erro{border-left:3px solid var(--R);padding:12px 14px;margin:26px 0;font-size:14px}
.rascunho{outline:1px dashed var(--I);outline-offset:-1px}
.qtd-ctl{display:flex;align-items:center;gap:10px;margin-bottom:11px;
  font-family:"JetBrains Mono",monospace;font-size:13px}
.qtd-ctl button{width:30px;height:30px;background:none;border:1px solid var(--linha);
  color:var(--osso);cursor:pointer;font-size:15px;line-height:1}
.qtd-ctl button:hover{border-color:var(--fosforo-d)}
.wpp{font-size:12px;color:var(--bruma);margin-top:9px;line-height:1.5}
.varsel{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;
  color:var(--bruma);margin:0 0 12px;letter-spacing:.08em;text-transform:uppercase}
.varsel select{width:100%;margin-top:6px;background:var(--preto);color:var(--osso);
  border:1px solid var(--linha);padding:10px;font-family:"JetBrains Mono",monospace;
  font-size:13px;text-transform:none;letter-spacing:0}
.varsel select:focus{outline:0;border-color:var(--fosforo-d)}
.intl{border:1px solid var(--I);border-left-width:3px;padding:12px 14px;margin-top:14px;
  font-size:13px;line-height:1.55;color:var(--bruma)}
.intl b{color:var(--I);font-family:"JetBrains Mono",monospace;font-size:12.5px}
.intl a{color:var(--I);font-family:"JetBrains Mono",monospace;font-size:12.5px;white-space:nowrap}
.apoio-g{margin-top:26px}
.apoio-t{font-family:"Silkscreen",monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fosforo-d);margin-bottom:10px}
.apoio-l{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.apoio-l{grid-template-columns:repeat(2,1fr)}}
.apoio-m{background:var(--carvao);border:1px solid var(--linha);padding:14px 16px}
.apoio-n{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:13px;margin-bottom:5px}
.apoio-v{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--fosforo);
  word-break:break-all;display:block}
.apoio-s{font-size:12px;color:var(--bruma);margin-top:3px}
.apoio-c{margin-top:11px;padding:6px 12px;font-size:11.5px}
</style>
</head>

const tv = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[LANG] || v.pt) : v;
const L = p => "#/" + (LANG === "pt" ? "" : "en/") + p;

const ROT = {
  edicao:{pt:"edição",en:"edition"}, ano:{pt:"ano",en:"year"},
  estado:{pt:"estado",en:"condition"}, origem:{pt:"origem",en:"origin"},
  idioma:{pt:"idioma",en:"language"}, serie:{pt:"série",en:"series"},
  escala:{pt:"escala",en:"scale"}, fabricante:{pt:"fabricante",en:"maker"},
  pecas:{pt:"peças",en:"pieces"}, editora:{pt:"editora",en:"publisher"},
  cartas:{pt:"cartas",en:"cards"}, papel:{pt:"papel",en:"paper"},
  corte:{pt:"corte",en:"cut"}, tiragem:{pt:"tiragem",en:"run"},
  unidades:{pt:"unidades",en:"units"}, formato:{pt:"formato",en:"size"},
  versao:{pt:"versão",en:"version"}, sangria:{pt:"sangria",en:"bleed"},
  licenca:{pt:"licença",en:"license"}, tipo:{pt:"tipo",en:"type"},
  verso:{pt:"verso",en:"back"}
};
const rot = k => (ROT[k] && ROT[k][LANG]) || k;

let CATALOGO = [], NOTAS = [], PRONTO = false, FALHA = null;

let FONTE = "arquivo";
async function carregar(){
  const base = (CFG.API_BASE || "").replace(/\/$/, "");
  try{
    let c = null;
    // O catálogo verdadeiro vive no banco, pelo Worker. O catalogo.json fica
    // como rede de segurança: se a API cair, a vitrine continua de pé com a
    // última versão publicada em vez de mostrar loja vazia.
    if(base){
      try{
        const r = await fetch(base + "/api/catalog", {cache:"no-store"});
        if(r.ok){ c = await r.json(); FONTE = "api"; }
      }catch(e){ /* silêncio: cai no arquivo */ }
    }
    if(!c) c = await fetch("catalogo.json?v=" + Date.now()).then(r => r.json());
    const n = await fetch("notas.json?v=" + Date.now()).then(r => r.json())
      .catch(() => ({notas:[]}));
    CATALOGO = (c.itens || []).filter(i => i.ativo !== false);
    NOTAS = n.notas || [];
    console.info("CESP · catálogo lido de: " + FONTE + " · " + CATALOGO.length + " itens");
  }catch(e){ FALHA = e.message; }
  PRONTO = true;
  rotear();
}

const brl = c => (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s == null ? "" : s).replace(/&(?!amp;|lt;|gt;|#)/g,"&amp;").replace(/</g,"&lt;");
const porId = id => CATALOGO.find(p => p.id === id);
const aVenda = p => p.preco > 0;
const maxDe = p => p.repro ? 20 : p.estoque;

function estadoItem(p){
  if(p.app) return {cls:"gratis", txt:t("e_gratis")};
  if(!aVenda(p)) return {cls:"acervo", txt:t("e_acervo")};
  if(p.estoque > 0) return {cls:"venda", txt:t("e_venda")};
  if(p.repro) return {cls:"encomenda", txt:t("e_encomenda")};
  return {cls:"esgotado", txt:t("e_esgotado")};
}
function manabar(mana){
  return '<div class="mn">' + ORDEM.map(m =>
    `<i class="${m===mana?"on":""}" style="background:var(--${m})"></i>`).join("") + '</div>';
}
function moldura(p, i, cls){
  const f = (p.fotos || [])[i];
  return f ? `<div class="${cls}"><img src="${esc(f)}" alt="${esc(p.nome)}" loading="lazy"></div>`
           : `<div class="${cls}">${i ? String(i+1).padStart(2,"0") : t("foto")}</div>`;
}

/* ---------------------------------------------------------------- carrinho */
let CART = [];
const qtdTotal = () => CART.reduce((s,l) => s+l.q, 0);
const chaveLinha = l => l.id + "|" + (l.vid || "");
const varDe = (p, vid) => (p.variacoes || []).find(v => v.id === vid) || null;
function precoDe(p, vid){ const v = varDe(p, vid); return v ? v.preco : p.preco; }
function estoqueDe(p, vid){ const v = varDe(p, vid); return v ? v.estoque : p.estoque; }
function maxLinha(p, vid){ return p.repro ? 20 : estoqueDe(p, vid); }
function nomeLinha(p, vid){
  const v = varDe(p, vid); return p.nome + (v ? " · " + v.nome : "");
}
function addCart(id, q, vid){
  const p = porId(id); if(!p) return;
  const chave = id + "|" + (vid || "");
  const l = CART.find(x => chaveLinha(x) === chave);
  const n = Math.max(1, q || 1);
  const teto = maxLinha(p, vid);
  if(l) l.q = Math.min(teto, l.q + n); else CART.push({id, vid: vid || "", q: Math.min(teto, n)});
  pintaCart(); abreCart();
}
function tiraCart(chave){ CART = CART.filter(l => chaveLinha(l) !== chave); pintaCart(); }
const abreCart = () => document.getElementById("drawer").classList.add("on");
const fechaCart = () => document.getElementById("drawer").classList.remove("on");

function textoPedido(){
  const linhas = CART.map(l => {
    const p = porId(l.id);
    return `${l.q}x ${nomeLinha(p, l.vid)} — ${brl(precoDe(p, l.vid))}`;
  });
  const sub = CART.reduce((s,l) => s + precoDe(porId(l.id), l.vid)*l.q, 0);
  return (LANG === "pt"
    ? "Olá! Quero fechar este pedido na CESP:\n\n"
    : "Hi! I'd like to place this CESP order:\n\n")
    + linhas.join("\n") + "\n\n" + t("subtotal") + ": " + brl(sub);
}

function finalizar(){
  if(!CART.length) return;
  if(CFG.API_BASE){
    location.href = CFG.API_BASE.replace(/\/$/,"") + "/checkout?cart=" +
      encodeURIComponent(JSON.stringify(CART));
    return;
  }
  window.open("https://wa.me/" + (CFG.WHATSAPP||"") + "?text=" +
    encodeURIComponent(textoPedido()), "_blank", "noopener");
}

function pintaCart(){
  document.getElementById("qtd").textContent = qtdTotal();
  const corpo = document.getElementById("cart-corpo"), pe = document.getElementById("cart-pe");
  if(!CART.length){ corpo.innerHTML = `<div class="vazio">${t("vazio")}</div>`; pe.innerHTML = ""; return; }
  corpo.innerHTML = CART.map(l => {
    const p = porId(l.id);
    const foto = (p.fotos||[])[0];
    const enc = estoqueDe(p, l.vid) === 0 && p.repro;
    return `<div class="linha-item">
      <div class="mini">${foto?`<img src="${esc(foto)}" alt="" style="width:100%;height:100%;object-fit:cover">`:""}</div>
      <div><div class="n">${esc(nomeLinha(p, l.vid))}</div>
      <div class="p">${l.q} × ${brl(precoDe(p, l.vid))}${enc?" · "+t("e_encomenda"):""}</div></div>
      <span class="x" data-tira="${esc(chaveLinha(l))}">&times;</span></div>`;
  }).join("");
  const sub = CART.reduce((s,l) => s + precoDe(porId(l.id), l.vid)*l.q, 0);
  const encomenda = CART.some(l => { const p = porId(l.id);
    return estoqueDe(p, l.vid) === 0 && p.repro; });
  pe.innerHTML = `<div class="tot"><span>${t("subtotal")}</span><span>${brl(sub)}</span></div>
    <div class="tot"><span>${t("frete")}</span><span style="color:var(--bruma)">${t("no_checkout")}</span></div>
    <div class="tot grande"><span>${t("total")}</span><span>${brl(sub)}</span></div>
    ${encomenda?`<div style="font-size:12px;color:var(--G);margin-bottom:12px" class="mono">${t("aviso_encomenda")}</div>`:""}
    <button class="btn cheio" id="finalizar" style="width:100%;padding:13px">${CFG.API_BASE?t("pagar"):t("wpp_btn")}</button>
    ${CFG.API_BASE?"":`<div class="wpp">${t("wpp_obs")}</div>`}`;
  corpo.querySelectorAll("[data-tira]").forEach(b => b.onclick = () => tiraCart(b.dataset.tira));
  const bf = document.getElementById("finalizar"); if(bf) bf.onclick = finalizar;
}

/* ---------------------------------------------------------------- telas */
function cardItem(p){
  const cat = CATS[p.cat] || CATS.games, est = estadoItem(p);
  const ficha = Object.values(p.ficha || {}).slice(0,2).map(tv).join(" · ");
  return `<a class="item" href="${L("item/"+p.id)}">${manabar(cat.mana)}
    ${moldura(p, 0, "foto")}
    <div class="txt">
      <div class="nm">${esc(p.nome)}</div>
      <div class="fc">${esc(ficha)}</div>
      <div class="pr">${aVenda(p)?`<span class="preco">${brl(p.preco)}</span>`:""}
        <span class="selo ${est.cls}">${est.txt}</span></div>
    </div></a>`;
}

function telaHome(){
  const destaque = CATALOGO.filter(p => aVenda(p) && !p.app).slice(0,3);
  const nota = NOTAS[0];
  return `<div class="wrap">
    <section class="hero">
      <div class="cli">cesp@archive:~$ <b>whoami</b></div>
      <h1>${t("hero_t")}</h1>
      <p>${t("hero_p")}</p>
      <div class="acoes">
        <a class="btn cheio" href="${L("shop")}">${t("cta_loja")}</a>
        <a class="btn" href="${L("apps")}">${t("cta_apps")}</a>
      </div>
    </section>
    <div class="cli mono" style="color:var(--fosforo-d);font-size:13px;margin-top:26px">cesp@archive:~$ <span style="color:var(--fosforo)">ls</span></div>
    <div class="ls">${Object.entries(CATS).map(([k,c]) => {
      const n = CATALOGO.filter(p => p.cat === k).length;
      return `<a href="${L(k)}" style="--cor:var(--${c.mana})">
        <span class="q"></span>
        <span><span class="n">${k}/</span><div class="d">${esc(tv(c.desc))}</div></span>
        <span class="c">${n}</span></a>`; }).join("")}</div>
    ${destaque.length?`<section class="secao">
      <div class="secao-cab"><h2>${t("a_venda")}</h2>
        <a class="sub" href="${L("shop")}">${t("ver_tudo")}</a></div>
      <div class="grade">${destaque.map(cardItem).join("")}</div>
    </section>`:""}
    ${nota?`<section class="secao" style="border-top:1px solid var(--linha)">
      <div class="secao-cab"><h2>${t("ultima_nota")}</h2><a class="sub" href="${L("notes")}">${t("todas")}</a></div>
      <div class="nota-lista"><a href="${L("notes/"+nota.slug)}">
        <div class="dt">${esc(nota.dt)}</div><div class="t">${esc(nota.t)}</div>
        <div class="r">${esc(nota.r)}</div></a></div>
    </section>`:""}
  </div>`;
}

function telaLista(titulo, itens, sub){
  return `<div class="wrap"><section class="secao">
    <div class="secao-cab"><h2>${esc(titulo)}</h2><span class="sub">${esc(sub)}</span></div>
    ${itens.length?`<div class="grade">${itens.map(cardItem).join("")}</div>`
      :`<div class="vazio">${t("nada")}</div>`}
  </section></div>`;
}

function telaItem(id){
  const p = porId(id);
  if(!p) return telaLista(t("nada"), [], "");
  const cat = CATS[p.cat] || CATS.games;
  let bloco;
  if(p.app){
    bloco = `<div class="compra"><div class="valor">${t("e_gratis")}</div>
      <div class="obs">${t("app_obs")}</div>
      ${p.url?`<a class="btn cheio" style="display:block;text-align:center;padding:13px" href="${esc(p.url)}" target="_blank" rel="noopener">${t("abrir")}</a>`
             :`<button class="btn cheio" disabled>${t("abrir")}</button>`}</div>`;
  } else if(!aVenda(p)){
    bloco = `<div class="compra"><div class="valor" style="font-size:20px">${t("acervo_tit")}</div>
      <div class="obs">${t("acervo_obs")}</div></div>`;
  } else if(p.estoque > 0 || p.repro){
    const vs = p.variacoes || [];
    const vSel = vs.length ? (vs.find(v => v.estoque > 0) || vs[0]) : null;
    const est = vSel ? vSel.estoque : p.estoque;
    const encomenda = est === 0 && p.repro;
    const obs = encomenda
      ? t("sem_estoque").replace("{d}", p.producao_dias || 7)
      : (est === 1 ? t("unica") : `${est} ${t("unidades")}.`) + " " + t("frete_checkout");
    const seletor = vs.length ? `<label class="varsel">${t("escolha")}
      <select id="varSel">${vs.map(v =>
        `<option value="${esc(v.id)}" data-preco="${v.preco}" data-est="${v.estoque}"
          ${v.id===vSel.id?"selected":""} ${v.estoque===0&&!p.repro?"disabled":""}>${esc(v.nome)}${
          v.estoque===0 ? " — " + t("e_esgotado") : ""}</option>`).join("")}</select></label>` : "";
    bloco = `<div class="compra">
      <div class="valor" id="valorSel">${brl(vSel ? vSel.preco : p.preco)}</div>
      <div class="obs" id="obsSel">${obs}</div>
      ${seletor}
      <div class="qtd-ctl"><button data-q="-">−</button><span id="q">1</span><button data-q="+">+</button></div>
      <button class="btn cheio" data-add="${p.id}">${encomenda?t("encomendar"):t("add")}</button></div>`;
  } else {
    bloco = `<div class="compra"><div class="valor" style="font-size:20px">${t("esgotado_tit")}</div>
      <div class="obs">${t("esgotado_obs")}</div></div>`;
  }
  const n = (p.fotos||[]).length;
  return `<div class="wrap"><div class="item-pg">
    <div class="galeria">
      ${moldura(p, 0, "g1")}
      ${[1,2,3,4].map(i => (i < n || n === 0) ? moldura(p, i, "gm") : "").join("")}
    </div>
    <div>
      <div class="cat mono" style="color:var(--${cat.mana})">~/${esc(p.cat)}</div>
      <h1>${esc(p.nome)}</h1>
      <p style="color:var(--bruma);margin:0">${esc(tv(p.desc))}</p>
      <div class="ficha">${Object.entries(p.ficha||{}).map(([k,v]) =>
        `<div><span>${esc(rot(k))}</span><span>${esc(tv(v))}</span></div>`).join("")}</div>
      ${bloco}
      ${(aVenda(p) && !p.app) ? avisoIntl() : ""}
    </div>
  </div></div>`;
}

function avisoIntl(){
  const ig = CFG.INSTAGRAM || "";
  return `<div class="intl">
    <b>${t("intl_tit")}</b> ${t("intl_txt")}
    ${ig?` <a href="${esc(ig)}" target="_blank" rel="noopener">${t("intl_btn")} →</a>`:""}
  </div>`;
}

function telaApoio(){
  const a = CFG.APOIO || {};
  const br = [];
  if(a.PIX) br.push({n:"Pix", v:a.PIX, sub:a.PIX_NOME||"", copia:true});
  const fora = [];
  if(a.PAYPAL) fora.push({n:"PayPal", v:a.PAYPAL, link:a.PAYPAL});
  if(a.VENMO)  fora.push({n:"Venmo", v:a.VENMO, copia:true});
  if(a.ZELLE)  fora.push({n:"Zelle", v:a.ZELLE, copia:true});

  const cartao = m => `<div class="apoio-m">
    <div class="apoio-n">${esc(m.n)}</div>
    ${m.link?`<a class="apoio-v" href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.v)} →</a>`
            :`<div class="apoio-v">${esc(m.v)}</div>`}
    ${m.sub?`<div class="apoio-s">${esc(m.sub)}</div>`:""}
    ${m.copia?`<button class="btn apoio-c" data-copia="${esc(m.v)}">${t("copiar")}</button>`:""}
  </div>`;

  const grupos = LANG === "pt" ? [[t("apoio_br"), br],[t("apoio_fora"), fora]]
                               : [[t("apoio_fora"), fora],[t("apoio_br"), br]];
  const corpo = (br.length + fora.length)
    ? grupos.filter(g => g[1].length).map(g =>
        `<div class="apoio-g"><div class="apoio-t">${g[0]}</div>
         <div class="apoio-l">${g[1].map(cartao).join("")}</div></div>`).join("")
    : `<div class="vazio">${t("apoio_vazio")}</div>`;

  return `<div class="wrap"><section class="secao">
    <div class="secao-cab"><h2>${t("apoio")}</h2></div>
    <p style="max-width:60ch;color:var(--bruma)">${t("apoio_p")}</p>
    ${corpo}
  </section></div>`;
}

function telaNotas(){
  return `<div class="wrap"><section class="secao">
    <div class="secao-cab"><h2>${t("notas")}</h2><span class="sub">${NOTAS.length} ${t("textos")}</span></div>
    ${NOTAS.length?`<div class="nota-lista">${NOTAS.map(n => `<a href="${L("notes/"+n.slug)}">
      <div class="dt">${esc(n.dt)}${(n.langs||["pt"]).includes(LANG)?"":" · "+(n.langs||["pt"]).join("/").toUpperCase()}</div>
      <div class="t">${esc(n.t)}</div><div class="r">${esc(n.r)}</div></a>`).join("")}</div>`
      :`<div class="vazio">${t("nada")}</div>`}
  </section></div>`;
}

function telaNota(slug){
  const n = NOTAS.find(x => x.slug === slug);
  if(!n) return telaNotas();
  const aviso = (n.langs||["pt"]).includes(LANG) ? ""
    : `<div class="dt" style="color:#8B5A00">${t("so_pt")}</div>`;
  return `<div class="wrap"><article class="artigo">
    <div class="dt">${esc(n.dt)}</div>${aviso}<h1>${esc(n.t)}</h1>
    ${(n.corpo||[]).map(par => `<p>${esc(par)}</p>`).join("")}
  </article></div>`;
}

/* ---------------------------------------------------------------- rotas */
function pintaDirs(atual){
  document.getElementById("dirs").innerHTML =
    `<a class="dir ${atual===""?"on":""}" href="${L("")}" style="--cor:var(--fosforo)">~</a>` +
    Object.entries(CATS).map(([k,c]) =>
      `<a class="dir ${atual===k?"on":""}" href="${L(k)}" style="--cor:var(--${c.mana})"><i></i>${k}/</a>`).join("") +
    `<a class="dir ${atual==="notes"?"on":""}" href="${L("notes")}" style="--cor:var(--fosforo)">notes/</a>`;
}
function pintaIdioma(resto){
  document.getElementById("idioma").innerHTML = ["pt","en"].map(l =>
    `<a class="lg ${l===LANG?"on":""}" href="#/${l==="pt"?"":"en/"}${resto}">${l}</a>`).join("");
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
}
function pintaRodape(){
  const r = document.getElementById("rodape-links"); if(!r) return;
  const ig = CFG.INSTAGRAM ? `<a href="${CFG.INSTAGRAM}" target="_blank" rel="noopener">instagram</a><br>` : "";
  const em = CFG.EMAIL ? `<a href="mailto:${CFG.EMAIL}">${t("rod_contato")}</a>` : "";
  r.innerHTML = `<div class="col">
      <a href="${L("shop")}">${t("loja").toLowerCase()}</a><br>
      <a href="${L("collection")}">${t("acervo").toLowerCase()}</a><br>
      <a href="${L("apps")}">${LANG==="pt"?"softwares":"software"}</a><br>
      <a href="${L("notes")}">${t("notas").toLowerCase()}</a>
    </div><div class="col">${ig}${em}<br>
      <a href="${L("support")}">${t("apoio").toLowerCase()}</a></div>`;
}

function rotear(){
  let p = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  LANG = (p[0] === "en") ? "en" : "pt";
  if(p[0] === "en" || p[0] === "pt") p = p.slice(1);

  const app = document.getElementById("app");
  document.getElementById("rot-cart").textContent = t("carrinho");
  pintaIdioma(p.join("/")); pintaRodape();

  if(!PRONTO){ app.innerHTML = `<div class="wrap"><div class="carregando">${t("carregando")}</div></div>`; return; }
  if(FALHA){
    app.innerHTML = `<div class="wrap"><div class="erro mono">${t("erro")}<br><span style="color:var(--bruma)">${esc(FALHA)}</span></div></div>`;
    return;
  }

  let caminho = "~$ <b>cd /</b>", dir = "";
  if(!p.length){ app.innerHTML = telaHome(); }
  else if(p[0] === "item"){
    const it = porId(p[1]); dir = it ? it.cat : "";
    caminho = `~$ <b>cat ${it?it.cat+"/"+it.id+".md":"?"}</b>`;
    app.innerHTML = telaItem(p[1]);
  }
  else if(p[0] === "notes"){
    dir = "notes";
    caminho = p[1] ? `~$ <b>cat notes/${p[1]}.md</b>` : "~$ <b>ls notes/</b>";
    app.innerHTML = p[1] ? telaNota(p[1]) : telaNotas();
  }
  else if(p[0] === "support"){
    caminho = "~$ <b>cat support.md</b>";
    app.innerHTML = telaApoio();
  }
  else if(p[0] === "shop"){
    caminho = "~$ <b>grep -rl 'price' .</b>";
    app.innerHTML = telaLista(t("loja"), CATALOGO.filter(x => aVenda(x) && !x.app), t("loja_sub"));
  }
  else if(p[0] === "collection"){
    caminho = "~$ <b>grep -rL 'price' .</b>";
    app.innerHTML = telaLista(t("acervo"), CATALOGO.filter(x => !aVenda(x) && !x.app), t("acervo_sub"));
  }
  else if(CATS[p[0]]){
    dir = p[0]; caminho = `~$ <b>ls ${p[0]}/</b>`;
    app.innerHTML = telaLista(p[0] + "/", CATALOGO.filter(x => x.cat === p[0]), tv(CATS[p[0]].desc));
  }
  else { app.innerHTML = telaHome(); }

  document.getElementById("caminho").innerHTML = caminho;
  pintaDirs(dir); pintaCart(); window.scrollTo(0,0);

  let q = 1;
  const cx = app.querySelector("#q");
  const sel = app.querySelector("#varSel");
  const idAtual = () => { const b = app.querySelector("[data-add]"); return b ? b.dataset.add : null; };
  const vidAtual = () => sel ? sel.value : "";

  if(sel) sel.onchange = () => {
    const p2 = porId(idAtual()); if(!p2) return;
    const v = varDe(p2, sel.value);
    const est = v ? v.estoque : p2.estoque;
    app.querySelector("#valorSel").textContent = brl(v ? v.preco : p2.preco);
    app.querySelector("#obsSel").innerHTML = (est === 0 && p2.repro)
      ? t("sem_estoque").replace("{d}", p2.producao_dias || 7)
      : (est === 1 ? t("unica") : `${est} ${t("unidades")}.`) + " " + t("frete_checkout");
    q = 1; if(cx) cx.textContent = "1";
  };

  app.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const p2 = porId(idAtual());
    const teto = p2 ? maxLinha(p2, vidAtual()) : 20;
    q = Math.min(Math.max(teto, 1), Math.max(1, q + (b.dataset.q === "+" ? 1 : -1)));
    if(cx) cx.textContent = q;
  });
  app.querySelectorAll("[data-add]").forEach(b =>
    b.onclick = () => addCart(b.dataset.add, q, vidAtual()));
  app.querySelectorAll("[data-copia]").forEach(b => b.onclick = () => {
    navigator.clipboard.writeText(b.dataset.copia).then(() => {
      b.textContent = t("copiado");
      setTimeout(() => b.textContent = t("copiar"), 1600);
    });
  });
}

window.addEventListener("hashchange", rotear);
document.getElementById("abrir-cart").onclick = abreCart;
document.getElementById("fechar-cart").onclick = fechaCart;
document.getElementById("fechar-fundo").onclick = fechaCart;
rotear();
carregar();
</script>
</body>
</html>
